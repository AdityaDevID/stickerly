name: Build Release APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Siapkan keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "APK akan ditandatangani dengan keystore rilis."
          else
            echo "::warning::KEYSTORE_BASE64 belum ada. Jalankan workflow 'Setup Keystore' dulu. Build kali ini memakai debug key."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/app-release.apk "Stickerly-v1.0.${{ github.run_number }}.apk"

      - name: Upload ke Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Stickerly v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Stickerly-v1.0.${{ github.run_number }}.apk
          generate_release_notes: true
