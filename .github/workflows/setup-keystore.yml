name: Setup Keystore

# Jalankan SEKALI dari tab Actions. Workflow ini membuat keystore dan
# menyimpannya otomatis ke GitHub Secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Syarat: secret GH_PAT (token dengan izin menulis Secrets) sudah dibuat di repo.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Timpa keystore yang sudah ada (HATI-HATI: update APK lama jadi gagal)"
        type: boolean
        default: false
      backup:
        description: "Simpan salinan keystore sebagai artifact (hanya 1 hari)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Cek GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Secret GH_PAT belum dibuat. Buat token (classic, scope repo), lalu simpan di Settings > Secrets and variables > Actions dengan nama GH_PAT."
            exit 1
          fi

      - name: Cek keystore yang sudah ada
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^KEYSTORE_BASE64'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Keystore sudah ada di Secrets."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'false' || inputs.force
        with:
          distribution: temurin
          java-version: "17"

      - name: Buat keystore dan simpan ke Secrets
        if: steps.check.outputs.exists == 'false' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          KS_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KS_PASS"
          KS_ALIAS=stickerly
          KS_FILE="$RUNNER_TEMP/stickerly-release.jks"

          keytool -genkeypair -keystore "$KS_FILE" -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Stickerly, OU=Stickerly, O=Stickerly, L=Jakarta, ST=DKI Jakarta, C=ID"

          base64 -w0 "$KS_FILE" | gh secret set KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$KS_PASS" | gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf '%s' "$KS_ALIAS" | gh secret set KEY_ALIAS --repo "$GITHUB_REPOSITORY"
          printf '%s' "$KS_PASS" | gh secret set KEY_PASSWORD --repo "$GITHUB_REPOSITORY"

          mkdir -p "$RUNNER_TEMP/backup"
          cp "$KS_FILE" "$RUNNER_TEMP/backup/stickerly-release.jks"
          printf 'alias=%s\nstorePassword=%s\nkeyPassword=%s\n' "$KS_ALIAS" "$KS_PASS" "$KS_PASS" > "$RUNNER_TEMP/backup/info.txt"
          echo "BACKUP_DIR=$RUNNER_TEMP/backup" >> "$GITHUB_ENV"
          echo "Selesai. Secrets sudah tersimpan."

      - name: Simpan salinan cadangan
        if: (steps.check.outputs.exists == 'false' || inputs.force) && inputs.backup
        uses: actions/upload-artifact@v4
        with:
          name: stickerly-keystore-backup
          path: ${{ env.BACKUP_DIR }}
          retention-days: 1

      - name: Sudah ada
        if: steps.check.outputs.exists == 'true' && !inputs.force
        run: echo "Tidak ada yang diubah. Jalankan ulang dengan force=true kalau memang mau membuat keystore baru."
